<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fotobahar Plato — Plato Deneyimi V3</title>
<style>
:root{--bg:#080a0e;--panel:rgba(10,12,17,.60);--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.075);--text:#f4f0e8;--muted:#bcb4a7;--gold:#d5b77d;--shadow:0 30px 100px rgba(0,0,0,.46)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050609;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}img{display:block}
#stage{position:fixed;inset:0;background:#050609;overflow:hidden}.bgBlur,.bgSharp{position:absolute;inset:-3%;opacity:0;transition:opacity 1.05s ease}.bgBlur{background-size:cover;background-position:center;filter:blur(30px) brightness(.48) saturate(.9);transform:scale(1.12)}.bgSharp img{width:100%;height:100%;object-fit:cover;animation:drift 9s ease-in-out both}.bgBlur.active,.bgSharp.active{opacity:1}.bgSharp{display:flex;align-items:center;justify-content:center}.bgSharp.portrait img{object-fit:contain;width:82%;height:96%;filter:drop-shadow(0 25px 60px rgba(0,0,0,.38))}.bgSharp:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,10,.80),rgba(5,7,10,.38) 32%,rgba(5,7,10,.11) 62%,rgba(5,7,10,.48)),linear-gradient(180deg,transparent 45%,rgba(5,7,10,.72))}@keyframes drift{from{transform:scale(1.02) translateX(-.3%)}to{transform:scale(1.075) translateX(.45%)}}
.app{position:relative;z-index:5;height:100vh;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}.glass{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);box-shadow:var(--shadow)}.topbar{min-height:64px;border-radius:18px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:radial-gradient(circle at 30% 24%,rgba(213,183,125,.55),transparent 42%),rgba(255,255,255,.05);position:relative}.logo:after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.72);border-radius:50%}.kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#cfc6b7}.brandName{font-size:14px;font-weight:800;letter-spacing:.06em}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#f2eee6;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:650}.btn:hover{background:rgba(255,255,255,.12)}.btn.active{border-color:rgba(213,183,125,.65)}.btn.primary{background:#f3eee5;color:#0c0d10;border-color:#f3eee5}.btn.tv{background:linear-gradient(135deg,#f4efe6,#d9c39c);color:#0d0e10;border:none}
.main{min-height:0;display:grid;grid-template-columns:1.04fr .68fr;gap:14px}.left,.right{border-radius:22px;padding:21px;min-height:0}.left{display:flex;flex-direction:column;justify-content:space-between}.topMeta{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow,.autoBadge{padding:8px 11px;border-radius:999px;border:1px solid var(--soft);background:rgba(255,255,255,.03);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#d9d0bf}.subtitle{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#ddd2bf;margin-bottom:12px}h1{font-size:clamp(40px,5.5vw,88px);line-height:.89;letter-spacing:-.062em;margin:0 0 15px;max-width:9ch}h1 .gold{color:transparent;background:linear-gradient(135deg,#fff,#eedab5 40%,#b0834c);-webkit-background-clip:text;background-clip:text}.desc{max-width:60ch;color:var(--muted);font-size:15px;line-height:1.68;margin-bottom:17px}.tags,.metrics,.bottomControls{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:8px 10px;border-radius:999px;border:1px solid var(--soft);background:rgba(255,255,255,.03);font-size:11px}.metrics{margin-top:22px}.metric{min-width:124px;padding:13px;border-radius:17px;border:1px solid var(--soft);background:rgba(255,255,255,.035)}.metric label{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#aa9f8d;margin-bottom:7px}.metric strong{font-size:18px}.bottomControls{margin-top:22px}.help{font-size:11px;color:#bdb3a4;margin-top:10px}.right{display:flex;flex-direction:column}.rightHead{display:flex;justify-content:space-between;margin-bottom:14px}.rightHead b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d7cebe}.overview{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--soft);height:200px;margin-bottom:13px}.overview img{width:100%;height:100%;object-fit:cover}.overview:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,7,10,.72))}.overMeta{position:absolute;z-index:2;left:15px;right:15px;bottom:13px}.overTitle{font-size:23px;font-weight:760}.thumbGrid{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;scrollbar-width:none}.thumb{position:relative;border:1px solid var(--soft);border-radius:15px;overflow:hidden;aspect-ratio:1.18/1;background:#111;cursor:pointer;padding:0}.thumb.active{outline:1px solid rgba(213,183,125,.7)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:9px;bottom:8px;font-size:10px;z-index:2}.strip{border-radius:20px;padding:10px 12px;display:flex;gap:10px;overflow:auto;scrollbar-width:none}.scene{min-width:220px;display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;border:1px solid var(--soft);background:rgba(255,255,255,.035);padding:9px;border-radius:16px;cursor:pointer}.scene.active{outline:1px solid rgba(213,183,125,.62);background:rgba(213,183,125,.075)}.scene img{width:78px;height:64px;object-fit:cover;border-radius:11px}.idx{font-size:9px;letter-spacing:.18em;color:#afa594}.name{font-size:15px;font-weight:750}.sub{font-size:10px;color:#beb4a4}.progress{position:fixed;z-index:7;left:14px;right:14px;bottom:5px;height:2px;background:rgba(255,255,255,.08)}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#fff,var(--gold))}.progress.go i{animation:pg 6.8s linear forwards}@keyframes pg{to{width:100%}}body.tv.idle .topbar,body.tv.idle .strip{opacity:.17}body.tv .topbar,body.tv .strip{transition:opacity .6s}
@media(max-width:1050px){.main{grid-template-columns:1fr}.right{display:none}h1{max-width:13ch}}@media(max-width:700px){html,body{overflow:auto}.app{height:auto;display:block;padding:8px}.topbar,.left,.strip{margin-bottom:8px}.topbar{display:block}.actions{margin-top:10px}h1{font-size:42px}}
</style>
</head>
<body>
<div id="stage"><div class="bgBlur active" id="blurA"></div><div class="bgBlur" id="blurB"></div><div class="bgSharp active" id="sharpA"><img></div><div class="bgSharp" id="sharpB"><img></div></div>
<div class="app">
<header class="glass topbar"><div class="brand"><div class="logo"></div><div><div class="kicker">Signature Digital Experience</div><div class="brandName">FOTOBAHAR PLATO — PLATO DENEYİMİ V3</div></div></div><div class="actions"><button class="btn active" id="autoBtn">Auto Tour: Açık</button><button class="btn tv" id="tvBtn">TV MODU</button><button class="btn primary" id="nextBtn">Sonraki Alan →</button></div></header>
<section class="main"><div class="glass left"><div><div class="topMeta"><div class="eyebrow" id="count"></div><div class="autoBadge" id="modeBadge">AUTO TOUR ACTIVE</div></div><div class="subtitle" id="subtitle"></div><h1 id="title"></h1><div class="desc" id="desc"></div><div class="tags" id="tags"></div><div class="metrics"><div class="metric"><label>Alan</label><strong id="metricScene"></strong></div><div class="metric"><label>Frame</label><strong id="metricFrames"></strong></div><div class="metric"><label>Geçiş</label><strong>6.8 sn</strong></div></div></div><div><div class="bottomControls"><button class="btn" id="prevBtn">← Önceki</button><button class="btn" id="pauseBtn">Auto Tour'u Durdur</button><button class="btn" id="frameBtn">Sonraki Frame →</button></div><div class="help">TV MODU: tam ekran + otomatik gezi + desteklenen cihazlarda ekranı uyanık tutma.</div></div></div>
<aside class="glass right"><div class="rightHead"><b>Selected Area / Frames</b><button class="btn" id="randomBtn">Random</button></div><div class="overview"><img id="overview"><div class="overMeta"><div class="overTitle" id="overTitle"></div></div></div><div class="thumbGrid" id="thumbGrid"></div></aside></section>
<section class="glass strip" id="strip"></section></div><div class="progress" id="progress"><i></i></div>
<script>
const SCENES=[{"title": "Palmiye Yolu", "subtitle": "Signature arrival lane", "desc": "Palmiyeler, desenli yol, güçlü perspektif ve klasik otomobil kareleriyle Fotobahar Plato’nun giriş imzası.", "tags": ["Signature", "Editorial", "Palm Lane"], "frames": ["01.webp", "02.webp", "03.webp", "04.webp"]}, {"title": "Gün Batımı", "subtitle": "Minimal stage / golden hour", "desc": "Minimal beyaz sahne ve gün batımı ışığı; yüksek moda hissinde sade ve sinematik bir çekim dünyası.", "tags": ["Golden Hour", "Minimal", "Cinematic"], "frames": ["05.webp", "06.webp"]}, {"title": "Nikah Bahçesi", "subtitle": "Open-air ceremony garden", "desc": "Çim alan, beyaz seremonik kurgu ve doğal çevreyle nikah, nişan ve butik organizasyonlar için ferah bir sahne.", "tags": ["Nikah", "Event", "Garden"], "frames": ["07.webp", "08.webp", "09.webp"]}, {"title": "Havuz & Kemer", "subtitle": "White architecture / reflection", "desc": "Beyaz mimari, su yansıması ve temiz zemin çizgileriyle Fotobahar’ın en premium ve zamansız çekim sahnelerinden biri.", "tags": ["Pool", "Architecture", "Luxury"], "frames": ["10.webp", "11.webp", "12.webp", "06.webp"]}, {"title": "Turuncu Ev", "subtitle": "Color story / Mediterranean mood", "desc": "Sıcak turuncu cephe ve güçlü renk kontrastlarıyla daha moda, daha cesur ve enerjik kareler.", "tags": ["Color Story", "Warm Tone", "Fashion"], "frames": ["13.webp", "14.webp"]}, {"title": "Çeşme", "subtitle": "Statement fountain / bright stone", "desc": "Beyaz taş zemin ve heykelsi çeşme kompozisyonu, temiz ve sofistike düğün fotoğrafları için güçlü bir odak noktası.", "tags": ["Fountain", "Fine Art", "Bright Set"], "frames": ["15.webp", "01.webp"]}, {"title": "Mustang", "subtitle": "Classic car / retro luxury", "desc": "Klasik otomobil, palmiye aksı ve açık çim alan; retro-lüks ve sinematik bir fotoğraf hikâyesi için karakterli bir set.", "tags": ["Mustang", "Classic", "Cinematic"], "frames": ["16.webp", "03.webp"]}, {"title": "Villa & Doğa", "subtitle": "Estate landscape / open lawn", "desc": "Ağaç dokusu, villa, açık çim ve geniş peyzaj; platonun gerçek ölçeğini ve doğal atmosferini gösteren nefes alan bölüm.", "tags": ["Estate", "Nature", "Storytelling"], "frames": ["17.webp", "18.webp", "19.webp", "20.webp"]}],DURATION=6800,$=id=>document.getElementById(id),P='photos/';
let scene=0,frame=0,front=0,auto=true,timer=null,wakeLock=null,tv=false,idleTimer=null;
const blur=[$('blurA'),$('blurB')],sharp=[$('sharpA'),$('sharpB')];
function restartProgress(){$('progress').classList.remove('go');void $('progress').offsetWidth;if(auto)$('progress').classList.add('go')}
function schedule(){clearTimeout(timer);if(auto)timer=setTimeout(autoNext,DURATION)}
function autoNext(){const s=SCENES[scene];if(frame<s.frames.length-1)frame++;else{scene=(scene+1)%SCENES.length;frame=0}render();schedule()}
function bg(src){const nf=front?0:1,inc=sharp[nf],out=sharp[front],bi=blur[nf],bo=blur[front];inc.className='bgSharp';inc.querySelector('img').src=P+src;bi.style.backgroundImage=`url("${P+src}")`;inc.classList.add('active');bi.classList.add('active');setTimeout(()=>{out.classList.remove('active');bo.classList.remove('active')},650);front=nf}
function render(){const s=SCENES[scene],src=s.frames[frame];bg(src);const w=s.title.split(' '),last=w.pop();$('title').innerHTML=`${w.join(' ')} <span class="gold">${last}</span>`;$('subtitle').textContent=s.subtitle;$('desc').textContent=s.desc;$('tags').innerHTML=s.tags.map(x=>`<span class="tag">${x}</span>`).join('');$('count').textContent=`SCENE ${String(scene+1).padStart(2,'0')} / ${String(SCENES.length).padStart(2,'0')}`;$('metricScene').textContent=`${scene+1} / ${SCENES.length}`;$('metricFrames').textContent=s.frames.length;$('overview').src=P+s.frames[0];$('overTitle').textContent=s.title;$('thumbGrid').innerHTML='';s.frames.forEach((x,i)=>{const b=document.createElement('button');b.className='thumb'+(i===frame?' active':'');b.innerHTML=`<img src="${P+x}"><span>Frame ${i+1}</span>`;b.onclick=()=>{frame=i;render();schedule()};$('thumbGrid').appendChild(b)});document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('active',i===scene));restartProgress()}
function build(){SCENES.forEach((s,i)=>{const e=document.createElement('article');e.className='scene';e.innerHTML=`<img src="${P+s.frames[0]}"><div><div class="idx">AREA ${String(i+1).padStart(2,'0')}</div><div class="name">${s.title}</div><div class="sub">${s.subtitle}</div></div>`;e.onclick=()=>{scene=i;frame=0;render();schedule()};$('strip').appendChild(e)})}
function setAuto(v){auto=v;clearTimeout(timer);$('autoBtn').classList.toggle('active',v);$('autoBtn').textContent=v?'Auto Tour: Açık':'Auto Tour: Kapalı';$('pauseBtn').textContent=v?"Auto Tour'u Durdur":'Auto Tour Başlat';$('modeBadge').textContent=v?'AUTO TOUR ACTIVE':'MANUAL MODE';restartProgress();schedule()}
function nextScene(){scene=(scene+1)%SCENES.length;frame=0;render();schedule()}function prevScene(){scene=(scene-1+SCENES.length)%SCENES.length;frame=0;render();schedule()}function nextFrame(){frame=(frame+1)%SCENES[scene].frames.length;render();schedule()}
async function enterTV(){tv=true;document.body.classList.add('tv');setAuto(true);try{await document.documentElement.requestFullscreen?.()}catch(e){}try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}resetIdle()}
function resetIdle(){document.body.classList.remove('idle');clearTimeout(idleTimer);if(tv)idleTimer=setTimeout(()=>document.body.classList.add('idle'),7000)}
window.addEventListener('mousemove',resetIdle);window.addEventListener('pointerdown',resetIdle);document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&tv&&'wakeLock'in navigator)try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}});
$('nextBtn').onclick=nextScene;$('prevBtn').onclick=prevScene;$('frameBtn').onclick=nextFrame;$('randomBtn').onclick=()=>{scene=Math.floor(Math.random()*SCENES.length);frame=0;render();schedule()};$('autoBtn').onclick=()=>setAuto(!auto);$('pauseBtn').onclick=()=>setAuto(!auto);$('tvBtn').onclick=enterTV;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScene();if(e.key==='ArrowLeft')prevScene();if(e.key==='ArrowUp')nextFrame();if(e.key===' '){e.preventDefault();setAuto(!auto)}if(e.key.toLowerCase()==='t')enterTV()});
build();render();schedule();
</script>
</body></html>
